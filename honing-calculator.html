<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>로스트아크 상급재련 20~30 계산기</title>
<style>
body { font-family: Arial, sans-serif; background:#111; color:#eee; padding:20px; }
h1 { color:#ffd700; }
input, select, button { padding:6px; margin:5px 0; width:200px; }
button { background:#ffd700; border:none; cursor:pointer; }
table { border-collapse: collapse; margin-top:20px; width:100%; }
th, td { border:1px solid #444; padding:8px; text-align:center; }
th { background:#222; }
.result { margin-top:20px; font-size:16px; }
</style>
</head>
<body>

<h1>로스트아크 상급재련 20~30 계산기</h1>

<h3>장비 선택</h3>
<select id="gear">
  <option value="armor">방어구</option>
  <option value="weapon">무기</option>
</select>

<h3>재료 시세 입력</h3>
운명의 수호석 가격 <input type="number" id="guard" value="10"><br>
운명의 파괴석 가격 <input type="number" id="destroy" value="10"><br>
운명의 돌파석 가격 <input type="number" id="leap" value="100"><br>
아비도스 융화재료 가격 <input type="number" id="fusion" value="300"><br>

<br>
<button onclick="calculate()">계산하기</button>

<div class="result" id="result"></div>

<script>
function calculate() {
  const gear = document.getElementById("gear").value;

  const price = {
    guard: +document.getElementById("guard").value,
    destroy: +document.getElementById("destroy").value,
    leap: +document.getElementById("leap").value,
    fusion: +document.getElementById("fusion").value
  };

  const config = gear === "armor" ? {
    gold: 2000,
    guard: 1000,
    destroy: 0,
    leap: 18,
    fusion: 17
  } : {
    gold: 3000,
    guard: 0,
    destroy: 1200,
    leap: 25,
    fusion: 28
  };

  let exp = 0;
  let stage = 20;
  let tries = 0;
  let gold = 0;
  let mats = { guard:0, destroy:0, leap:0, fusion:0 };
  let blessingCount = 0;
  let enhanced = false;

  while (stage < 30) {
    tries++;
    blessingCount++;

    let gain = 28; // 책+숨결 기본 기대값

    // 선조의 가호
    if (blessingCount === 6) {
      blessingCount = 0;
      const roll = Math.random();

      if (!enhanced) {
        if (roll < 1/6) gain *= 5;                 // 갈라투르
        else if (roll < 2/6) gain *= 3;            // 겔라르
        else if (roll < 3/6) gain += 30;           // 쿠훔바르
        else if (roll < 4/6) { gain += 10; }       // 테메르
        else if (roll < 5/6) enhanced = true;      // 나베르
        else { stage++; exp = 0; continue; }       // 에베르
      } else {
        if (roll < 1/5) gain *= 7;
        else if (roll < 2/5) gain *= 5;
        else if (roll < 3/5) { gain += 80; blessingCount = 0; }
        else if (roll < 4/5) gain += 30;
        else { stage += 2; exp = 0; continue; }
      }
    }

    exp += gain;

    gold += config.gold;
    mats.guard += config.guard;
    mats.destroy += config.destroy;
    mats.leap += config.leap;
    mats.fusion += config.fusion;

    if (exp >= 1000) {
      stage++;
      exp = 0;
    }
  }

  const totalCost =
    gold +
    mats.guard * price.guard +
    mats.destroy * price.destroy +
    mats.leap * price.leap +
    mats.fusion * price.fusion;

  document.getElementById("result").innerHTML = `
    <h3>결과</h3>
    총 시도 횟수: ${tries.toFixed(1)} 회<br>
    총 골드 소모: ${gold.toLocaleString()} G<br>
    총 재료 비용 포함: <b>${totalCost.toLocaleString()} G</b><br>
    선조 강화 상태: ${enhanced ? "도달" : "미도달"}
  `;
}
</script>

</body>
</html>
