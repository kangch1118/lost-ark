<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>로스트아크 상급재련 20~30 계산기 (최종)</title>
<style>
body{background:#111;color:#eee;font-family:Arial;padding:20px}
h1,h2,h3{color:#ffd700}
section{border:1px solid #333;padding:15px;margin-bottom:20px}
input,button{padding:6px;margin:4px}
button{background:#ffd700;border:none;cursor:pointer;font-weight:bold}
.hidden{display:none}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #444;padding:6px;text-align:right}
th{background:#222}
th:first-child,td:first-child{text-align:left}
.topbar{display:flex;justify-content:space-between;align-items:center}
.note{color:#aaa;font-size:13px}
</style>
</head>
<body>

<div class="topbar">
  <h1>상급재련 20~30 계산기 (기댓값 · 최종)</h1>
  <button onclick="loadSharedPrice()">🌐 공용 시세 불러오기</button>
</div>
<div id="priceInfo" class="note"></div>

<section>
<h2>장비 선택</h2>
<label><input type="radio" name="gear" value="armor" checked onchange="toggleUI()"> 방어구</label>
<label><input type="radio" name="gear" value="weapon" onchange="toggleUI()"> 무기</label>
</section>

<section>
<h2>재료 가격</h2>

<div id="armorPrice">
수호석 <input id="guardP" type="number">
빙하 숨결 <input id="iceP" type="number">
방어구 책 <input id="armorBookP" type="number">
</div>

<div id="weaponPrice" class="hidden">
파괴석 <input id="destroyP" type="number">
용암 숨결 <input id="lavaP" type="number">
무기 책 <input id="weaponBookP" type="number">
</div>

돌파석 <input id="leapP" type="number">
융화재료 <input id="fusionP" type="number">
</section>

<section>
<h2>보유 수량</h2>

<div id="armorOwned">
수호석 <input id="guardO" type="number" value="0">
빙하 숨결 <input id="iceO" type="number" value="0">
방어구 책 <input id="armorBookO" type="number" value="0">
</div>

<div id="weaponOwned" class="hidden">
파괴석 <input id="destroyO" type="number" value="0">
용암 숨결 <input id="lavaO" type="number" value="0">
무기 책 <input id="weaponBookO" type="number" value="0">
</div>

돌파석 <input id="leapO" type="number" value="0">
융화재료 <input id="fusionO" type="number" value="0">
</section>

<button onclick="run()">계산</button>

<div id="result"></div>

<script>
/* ---------- 시세 연동 ---------- */
async function loadSharedPrice(){
  const res = await fetch("prices.json");
  const d = await res.json();
  const g = document.querySelector('input[name=gear]:checked').value;

  if(g==="armor"){
    guardP.value=d.armor.guard;
    iceP.value=d.armor.breath;
    armorBookP.value=d.armor.book;
  }else{
    destroyP.value=d.weapon.destroy;
    lavaP.value=d.weapon.breath;
    weaponBookP.value=d.weapon.book;
  }
  leapP.value=d.armor.leap;
  fusionP.value=d.armor.fusion;
  priceInfo.innerText="공용 시세 기준일: "+d.updated;
}

/* ---------- UI ---------- */
function toggleUI(){
  const g=document.querySelector('input[name=gear]:checked').value;
  armorPrice.classList.toggle("hidden",g!=="armor");
  armorOwned.classList.toggle("hidden",g!=="armor");
  weaponPrice.classList.toggle("hidden",g!=="weapon");
  weaponOwned.classList.toggle("hidden",g!=="weapon");
}

/* ---------- 기댓값 계산 엔진 ---------- */

// 기본 경험치
const BASE_EXP = 13;

// 성공/대성공/대성공x2 → 평균 배율
function avgMul(p){
  return p.s*1 + p.b*2 + p.bb*3;
}

// 확률 테이블
const PROB = {
  normal:{s:0.8,b:0.15,bb:0.05},
  both:{s:0.0,b:0.6,bb:0.4}
};

// 선조의 가호 → 경험치 보너스만 반영
function ancestorExpBonus(){
  return (1/6) * (
    0.125 * BASE_EXP*4 +
    0.25  * BASE_EXP*2 +
    0.125 * 30 +
    0.25  * 10
  );
}

// 전략별 1회 평균 경험치
function expPerTry(strategy){
  if(strategy==="normal"){
    return BASE_EXP * avgMul(PROB.normal);
  }
  if(strategy==="bless"){
    return BASE_EXP * avgMul(PROB.normal) + ancestorExpBonus();
  }
  // always
  return BASE_EXP * avgMul(PROB.both) + ancestorExpBonus();
}

/* ---------- 실행 ---------- */
function run(){
  const g=document.querySelector('input[name=gear]:checked').value;

  const price={
    guard:+guardP?.value||0,
    destroy:+destroyP?.value||0,
    leap:+leapP.value,
    fusion:+fusionP.value,
    book:g==="armor"?+armorBookP.value:+weaponBookP.value,
    breath:g==="armor"?+iceP.value:+lavaP.value
  };

  const owned={
    guard:+guardO?.value||0,
    destroy:+destroyO?.value||0,
    leap:+leapO.value,
    fusion:+fusionO.value,
    book:g==="armor"?+armorBookO.value:+weaponBookO.value,
    breath:g==="armor"?+iceO.value:+lavaO.value
  };

  const goldBase = g==="armor"?2000:3000;
  const leapUse = g==="armor"?18:25;
  const fusionUse = g==="armor"?17:28;
  const stoneUse = g==="armor"?1000:1200;

  const strategies=[
    {k:"normal",n:"① 일반",useBook:false},
    {k:"bless",n:"② 가호 때만",useBook:true},
    {k:"always",n:"③ 항상 책+숨결",useBook:true}
  ];

  let html="";

  strategies.forEach(s=>{
    const ept = expPerTry(s.k);
    const triesPerStage = 1000 / ept;
    const totalTries = triesPerStage * 10;

    const use={
      guard:g==="armor"? totalTries*stoneUse : 0,
      destroy:g==="weapon"? totalTries*stoneUse : 0,
      leap:totalTries*leapUse,
      fusion:totalTries*fusionUse,
      book:s.useBook? totalTries : 0,
      breath:s.useBook? totalTries : 0
    };

    const cost=(n,o,p)=>Math.max(0,n-o)*p;
    const totalGold =
      totalTries*goldBase +
      cost(use.guard,owned.guard,price.guard) +
      cost(use.destroy,owned.destroy,price.destroy) +
      cost(use.leap,owned.leap,price.leap) +
      cost(use.fusion,owned.fusion,price.fusion) +
      cost(use.book,owned.book,price.book) +
      cost(use.breath,owned.breath,price.breath);

    html+=`
    <section>
      <h3>${s.n}</h3>
      평균 재련 횟수: ${totalTries.toFixed(1)}회<br>
      총 골드: <b>${Math.round(totalGold).toLocaleString()}</b>
    </section>
    `;
  });

  result.innerHTML=html;
}
</script>

</body>
</html>
