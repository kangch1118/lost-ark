<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>로스트아크 상급재련 20~30 완전 시뮬레이터</title>
<style>
body{background:#111;color:#eee;font-family:Arial;padding:20px}
h1,h2,h3{color:#ffd700}
section{border:1px solid #333;padding:15px;margin-bottom:20px}
button,input{padding:6px;margin:4px}
button{background:#ffd700;border:none;font-weight:bold;cursor:pointer}
table{border-collapse:collapse;width:100%;margin-top:10px}
th,td{border:1px solid #444;padding:6px;text-align:right}
th:first-child,td:first-child{text-align:left}
.hidden{display:none}
.note{color:#aaa;font-size:13px}
</style>
</head>
<body>

<h1>상급재련 20~30 완전 계산기 (정확성 최우선)</h1>

<section>
<label><input type="radio" name="gear" value="armor" checked> 방어구</label>
<label><input type="radio" name="gear" value="weapon"> 무기</label>
<button onclick="loadSharedPrice()">🌐 시세 불러오기</button>
<button onclick="unlock()">🔒 수동입력</button>
<div id="priceInfo" class="note"></div>
</section>

<section>
<h2>재료 가격</h2>
<div id="armorPrice">
수호석 <input id="guardP" type="number" disabled>
빙하숨결 <input id="iceP" type="number" disabled>
방어구책 <input id="armorBookP" type="number" disabled>
</div>
<div id="weaponPrice" class="hidden">
파괴석 <input id="destroyP" type="number" disabled>
용암숨결 <input id="lavaP" type="number" disabled>
무기책 <input id="weaponBookP" type="number" disabled>
</div>
돌파석 <input id="leapP" type="number" disabled>
융화재료 <input id="fusionP" type="number" disabled>
</section>

<button onclick="run()">계산</button>
<div id="result"></div>

<script>
/* ================= 기본 설정 ================= */
const ADMIN_PW = "1118";
const EXP_VALUES = [10,20,40];
const STAGE_EXP = 1000;

/* 성공 확률 테이블 */
const PROB = {
  normal: [{e:10,p:0.8},{e:20,p:0.15},{e:40,p:0.05}],
  breath: [{e:10,p:0.5},{e:20,p:0.3},{e:40,p:0.2}],
  book:   [{e:10,p:0.3},{e:20,p:0.45},{e:40,p:0.25}],
  both:   [{e:20,p:0.6},{e:40,p:0.4}]
};

/* 선조의 가호 확률 */
const ANCESTOR = [
  {name:"갈라투르", p:0.125, type:"mul", v:7},
  {name:"겔라르",   p:0.25,  type:"mul", v:5},
  {name:"쿠훔바르", p:0.125, type:"add", v:80},
  {name:"테메르",   p:0.25,  type:"add", v:30},
  {name:"에베르",   p:0.125, type:"skip"},
  {name:"나베르",   p:0.125, type:"naver"}
];

/* ================= 유틸 ================= */
function unlock(){
  if(prompt("비밀번호")!==ADMIN_PW){alert("실패");return;}
  document.querySelectorAll("input").forEach(i=>i.disabled=false);
}

async function loadSharedPrice(){
  const r=await fetch("prices.json"); const d=await r.json();
  guardP.value=d.armor.guard;
  iceP.value=d.armor.breath;
  armorBookP.value=d.armor.book;
  destroyP.value=d.weapon.destroy;
  lavaP.value=d.weapon.breath;
  weaponBookP.value=d.weapon.book;
  leapP.value=d.armor.leap;
  fusionP.value=d.armor.fusion;
  priceInfo.innerText="시세 기준: "+d.updated;
}

/* ================= 상태 기반 기댓값 계산 ================= */

/*
상태: (stage, exp, ancCnt, naver)
DP[state] = 기대 비용
*/

function run(){
  const strategyList = [
    {key:"normal", name:"일반"},
    {key:"bless",  name:"가호때만"},
    {key:"always", name:"항상"}
  ];

  let html="";
  strategyList.forEach(s=>{
    const res = solveStrategy(s.key);
    html+=`<section><h2>${s.name}</h2>
    평균 재련횟수: ${res.tries.toFixed(2)}회<br>
    총 골드(재료포함): <b>${Math.round(res.gold).toLocaleString()}</b>
    </section>`;
  });

  result.innerHTML=html;
}

/* ================= 핵심 Solver ================= */

function solveStrategy(strategy){
  const memo = new Map();

  function key(st){
    return `${st.stage}|${st.exp}|${st.c}|${st.n}`;
  }

  function dfs(st){
    if(st.stage>=30) return {tries:0,gold:0};
    const k=key(st);
    if(memo.has(k)) return memo.get(k);

    let expTable = PROB[
      strategy==="normal"?"normal":
      strategy==="always"?"both":"normal"
    ];

    let acc={tries:1,gold:2000};

    expTable.forEach(r=>{
      let nst={...st};
      let gain=r.e;

      nst.c++;
      if(nst.c===6){
        nst.c=0;
        ANCESTOR.forEach(a=>{
          let p=a.p;
          let temp={...nst};
          if(a.type==="mul") gain*=a.v;
          if(a.type==="add") gain+=a.v;
          if(a.type==="skip"){
            temp.stage++;
            temp.exp=0;
          }
          if(a.type==="naver"){
            temp.n=true;
          }
        });
      }

      nst.exp+=gain;
      while(nst.exp>=1000){
        nst.exp-=1000;
        nst.stage++;
      }

      const sub=dfs(nst);
      acc.tries+=r.p*sub.tries;
      acc.gold+=r.p*sub.gold;
    });

    memo.set(k,acc);
    return acc;
  }

  return dfs({stage:20,exp:0,c:0,n:false});
}
</script>
</body>
</html>
