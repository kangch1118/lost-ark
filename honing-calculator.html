<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>상급재련 20~30 계산기 (기댓값 · 단계당 비용)</title>
<style>
body{background:#111;color:#eee;font-family:Arial;padding:20px}
h1,h2{color:#ffd700}
section{border:1px solid #333;padding:15px;margin-bottom:20px}
input,button{padding:6px;margin:4px}
button{background:#ffd700;border:none;cursor:pointer;font-weight:bold}
.hidden{display:none}
</style>
</head>
<body>

<h1>상급재련 20~30 계산기 (기댓값 · 단계당 비용)</h1>

<section>
<label><input type="radio" name="gear" value="armor" checked onchange="toggleUI()"> 방어구</label>
<label><input type="radio" name="gear" value="weapon" onchange="toggleUI()"> 무기</label>
</section>

<section>
<h2>재료 가격</h2>

<div id="armorPrice">
수호석 <input id="guardP" type="number">
빙하 숨결 <input id="iceP" type="number">
방어구 책 <input id="armorBookP" type="number">
</div>

<div id="weaponPrice" class="hidden">
파괴석 <input id="destroyP" type="number">
용암 숨결 <input id="lavaP" type="number">
무기 책 <input id="weaponBookP" type="number">
</div>

돌파석 <input id="leapP" type="number">
융화재료 <input id="fusionP" type="number">
</section>

<button onclick="run()">계산</button>

<div id="result"></div>

<script>
function toggleUI(){
  const g=document.querySelector('input[name=gear]:checked').value;
  armorPrice.classList.toggle("hidden",g!=="armor");
  weaponPrice.classList.toggle("hidden",g!=="weapon");
}

/* ---------- 기댓값 계산 ---------- */

// 기본 경험치
const BASE_EXP = 13;

// 확률 테이블 → 평균 배율
function avgMul(p){
  return p.s*1 + p.b*2 + p.bb*3;
}

// 확률
const PROB = {
  normal:{s:0.8,b:0.15,bb:0.05},
  both:{s:0.0,b:0.6,bb:0.4}
};

// 선조의 가호: 경험치 기댓값 (6회당 1회)
function ancestorExpBonus(){
  return (1/6) * (
    0.125 * BASE_EXP*4 +
    0.25  * BASE_EXP*2 +
    0.125 * 30 +
    0.25  * 10
  );
}

// 에베르 단계 스킵 기댓값
function ancestorStageSkip(){
  return (1/6) * 0.125;
}

function calc(strategy,gear){
  const gold = gear==="armor"?2000:3000;
  const totalStages = 10 - ancestorStageSkip();

  let expPerTry;
  if(strategy==="normal"){
    expPerTry = BASE_EXP * avgMul(PROB.normal);
  }else{
    expPerTry = BASE_EXP * avgMul(PROB.both) + ancestorExpBonus();
  }

  const triesPerStage = 1000 / expPerTry;
  const totalTries = triesPerStage * totalStages;

  const totalGold = totalTries * gold;

  return {
    tries: totalTries,
    gold: totalGold
  };
}

function run(){
  const g=document.querySelector('input[name=gear]:checked').value;

  const strategies=[
    {k:"normal",n:"일반"},
    {k:"always",n:"항상 책+숨결"}
  ];

  let html="";
  strategies.forEach(s=>{
    const r=calc(s.k,g);
    html+=`
      <section>
        <h2>${s.n}</h2>
        평균 재련 횟수: ${r.tries.toFixed(1)}회<br>
        총 골드: ${Math.round(r.gold).toLocaleString()}
      </section>
    `;
  });

  result.innerHTML=html;
}
</script>

</body>
</html>
