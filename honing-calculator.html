<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>상급재련 21–30 단계 강화표</title>
<style>
body{
  background:#0f1115;
  color:#eaeaea;
  font-family:Pretendard,Arial,sans-serif;
  padding:24px
}
h1{color:#ffd966}
section{
  background:#171a21;
  border-radius:16px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 6px 16px rgba(0,0,0,.25)
}
h2{color:#ffd966;margin-top:0}
.flex{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
button{
  background:#ffd966;border:none;
  border-radius:12px;
  padding:10px 16px;
  font-weight:700;cursor:pointer
}
input{
  background:#0f1115;color:#eaeaea;
  border:1px solid #333;
  border-radius:10px;
  padding:6px 10px;
  width:110px
}
table{
  width:100%;border-collapse:collapse;margin-top:12px
}
th,td{
  border-bottom:1px solid #2a2d35;
  padding:8px;text-align:right
}
th:first-child,td:first-child{text-align:left}
.hidden{display:none}
.note{color:#aaa;font-size:12px;text-align:right}
</style>
</head>
<body>

<h1>상급재련 21–30 단계 강화표</h1>

<section class="flex">
  <button onclick="loadPrices()">시세 불러오기</button>
</section>

<section>
<label><input type="radio" name="gear" value="armor" checked onchange="toggle()"> 방어구</label>
<label><input type="radio" name="gear" value="weapon" onchange="toggle()"> 무기</label>
</section>

<section>
<h2>재료 가격</h2>
<div id="armorPrice" class="flex">
수호석 <input id="guardP" type="number">
빙하숨결 <input id="iceP" type="number">
방어구책 <input id="armorBookP" type="number">
</div>
<div id="weaponPrice" class="flex hidden">
파괴석 <input id="destroyP" type="number">
용암숨결 <input id="lavaP" type="number">
무기책 <input id="weaponBookP" type="number">
</div>
<div class="flex">
돌파석 <input id="leapP" type="number">
융화재료 <input id="fusionP" type="number">
</div>
</section>

<section>
<h2>보유 수량</h2>
<div id="armorOwned" class="flex">
수호석 <input id="guardO" type="number" value="0">
빙하숨결 <input id="iceO" type="number" value="0">
방어구책 <input id="armorBookO" type="number" value="0">
</div>
<div id="weaponOwned" class="flex hidden">
파괴석 <input id="destroyO" type="number" value="0">
용암숨결 <input id="lavaO" type="number" value="0">
무기책 <input id="weaponBookO" type="number" value="0">
</div>
<div class="flex">
돌파석 <input id="leapO" type="number" value="0">
융화재료 <input id="fusionO" type="number" value="0">
</div>
</section>

<section>
<button onclick="run()">계산</button>
</section>

<div id="result"></div>

<div class="note">이 계산기를 니나브 서버의 애교많은년을 위해 헌정합니다</div>

<script>
const TOTAL_EXP = 1000;
const SIM_COUNT = 5;

async function loadPrices(){
  const d = await (await fetch("prices.json")).json();
  guardP.value=d.armor.guard;
  iceP.value=d.armor.breath;
  armorBookP.value=d.armor.book;
  destroyP.value=d.weapon.destroy;
  lavaP.value=d.weapon.breath;
  weaponBookP.value=d.weapon.book;
  leapP.value=d.armor.leap;
  fusionP.value=d.armor.fusion;
}

function toggle(){
  const g=document.querySelector('input[name=gear]:checked').value;
  armorPrice.classList.toggle("hidden",g!=="armor");
  armorOwned.classList.toggle("hidden",g!=="armor");
  weaponPrice.classList.toggle("hidden",g!=="weapon");
  weaponOwned.classList.toggle("hidden",g!=="weapon");
}

/* ===== 시뮬레이션 1회 ===== */
function simulateOnce(strategy, gear, cost){
  let exp=0, tries=0;
  let natural=0, recharge=false, enhanced=false;

  let mats={guard:0,destroy:0,leap:0,fusion:0,book:0,breath:0};
  let gold=0;

  while(exp<TOTAL_EXP){
    tries++;
    gold+=cost.gold;

    let isAncestor = recharge || natural===5;
    recharge=false;

    mats[cost.main]+=cost.mainAmt;
    mats.leap+=cost.leap;
    mats.fusion+=cost.fusion;

    let useBook = strategy==="always" || (strategy==="bless" && isAncestor);
    if(useBook){ mats.book++; mats.breath+=20; }

    let r=Math.random(), gain=0;
    if(useBook) gain = r<0.6?20:40;
    else gain = r<0.8?10:r<0.95?20:40;

    if(isAncestor){
      let a=Math.random();
      if(enhanced){
        if(a<0.2) gain*=7;
        else if(a<0.4) gain*=5;
        else if(a<0.6){ gain+=80; recharge=true; }
        else if(a<0.8){ gain+=30; }
        else{ exp+=200; gain=0; }
        enhanced=false;
      }else{
        if(a<1/6) gain*=5;
        else if(a<2/6) gain*=3;
        else if(a<3/6){ gain+=30; recharge=true; }
        else if(a<4/6){ gain+=10; }
        else if(a<5/6){ recharge=true; enhanced=true; gain=0; }
        else{ exp+=100; gain=0; }
      }
      natural=0;
    }else natural++;

    exp+=gain;
  }
  return {tries,gold,mats};
}

/* ===== 5회 평균 ===== */
function simulateAverage(strategy, gear, cost){
  let sum={tries:0,gold:0,mats:{guard:0,destroy:0,leap:0,fusion:0,book:0,breath:0}};
  for(let i=0;i<SIM_COUNT;i++){
    const r=simulateOnce(strategy,gear,cost);
    sum.tries+=r.tries;
    sum.gold+=r.gold;
    for(let k in sum.mats) sum.mats[k]+=r.mats[k];
  }
  sum.tries/=SIM_COUNT;
  sum.gold/=SIM_COUNT;
  for(let k in sum.mats) sum.mats[k]/=SIM_COUNT;
  return sum;
}

function run(){
  const gear=document.querySelector('input[name=gear]:checked').value;
  const cost = gear==="armor"
    ? {gold:2000,main:"guard",mainAmt:1000,leap:18,fusion:17}
    : {gold:3000,main:"destroy",mainAmt:1200,leap:25,fusion:28};

  const price={
    guard:+guardP.value||0,destroy:+destroyP.value||0,
    leap:+leapP.value||0,fusion:+fusionP.value||0,
    book:gear==="armor"?+armorBookP.value:+weaponBookP.value,
    breath:gear==="armor"?+iceP.value:+lavaP.value
  };

  const owned={
    guard:+guardO.value||0,destroy:+destroyO.value||0,
    leap:+leapO.value||0,fusion:+fusionO.value||0,
    book:gear==="armor"?+armorBookO.value:+weaponBookO.value,
    breath:gear==="armor"?+iceO.value:+lavaO.value
  };

  const strategies=[
    {k:"normal",n:"일반"},
    {k:"bless",n:"선조 턴만 책·숨결"},
    {k:"always",n:"항상 책·숨결"}
  ];

  let html="";
  strategies.forEach(s=>{
    const r=simulateAverage(s.k,gear,cost);
    let total=r.gold;
    let rows=`
      <tr>
        <td>강화 비용</td>
        <td>${r.tries.toFixed(1)}회</td>
        <td>${Math.round(r.gold).toLocaleString()}</td>
      </tr>`;

    function add(name,key){
      const need=Math.max(0,r.mats[key]-owned[key]);
      const g=need*price[key];
      total+=g;
      rows+=`<tr><td>${name}</td><td>${r.mats[key].toFixed(1)}</td><td>${Math.round(g).toLocaleString()}</td></tr>`;
    }

    add(cost.main==="guard"?"수호석":"파괴석",cost.main);
    add("돌파석","leap");
    add("융화재료","fusion");
    if(r.mats.book>0){ add("재련서","book"); add("숨결","breath"); }

    html+=`
    <section>
      <h2>${s.n}</h2>
      <table>
        <tr><th>항목</th><th>횟수/수량</th><th>골드</th></tr>
        ${rows}
        <tr><th colspan="2">총 골드</th><th>${Math.round(total).toLocaleString()}</th></tr>
      </table>
    </section>`;
  });

  result.innerHTML=html;
}
</script>

</body>
</html>
