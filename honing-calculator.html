<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>로스트아크 상급재련 20~30 계산기 (안정판)</title>
<style>
body{background:#111;color:#eee;font-family:Arial;padding:20px}
h1,h2,h3{color:#ffd700}
section{border:1px solid #333;padding:15px;margin-bottom:20px}
input,button{padding:6px;margin:4px}
button{background:#ffd700;border:none;cursor:pointer;font-weight:bold}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #444;padding:6px;text-align:right}
th{background:#222}
th:first-child,td:first-child{text-align:left}
.hidden{display:none}
</style>
</head>
<body>

<h1>상급재련 20~30 계산기 (안정판)</h1>

<section>
<label><input type="radio" name="gear" value="armor" checked onchange="toggleUI()"> 방어구</label>
<label><input type="radio" name="gear" value="weapon" onchange="toggleUI()"> 무기</label>
</section>

<section>
<h2>재료 가격</h2>
<div id="armorPrice">
수호석 <input id="guardP" type="number"><br>
빙하 숨결 <input id="iceP" type="number"><br>
방어구 책 <input id="armorBookP" type="number">
</div>
<div id="weaponPrice" class="hidden">
파괴석 <input id="destroyP" type="number"><br>
용암 숨결 <input id="lavaP" type="number"><br>
무기 책 <input id="weaponBookP" type="number">
</div>
돌파석 <input id="leapP" type="number"><br>
융화재료 <input id="fusionP" type="number">
</section>

<button onclick="run()">계산</button>
<div id="result"></div>

<script>
function toggleUI(){
  const g=document.querySelector('input[name=gear]:checked').value;
  armorPrice.classList.toggle("hidden",g!=="armor");
  weaponPrice.classList.toggle("hidden",g!=="weapon");
}

/* 기준값 (정규화) */
const BASE_TRIES_PER_STAGE = 6;

/* 전략별 상대 효율 */
const STRATEGY = {
  normal: 1.00,
  bless: 0.82,
  always: 0.68
};

function run(){
  const g=document.querySelector('input[name=gear]:checked').value;
  const goldBase = g==="armor"?2000:3000;
  const stone = g==="armor"?1000:1200;
  const leap = g==="armor"?18:25;
  const fusion = g==="armor"?17:28;

  const price={
    guard:+guardP?.value||0,
    destroy:+destroyP?.value||0,
    leap:+leapP.value||0,
    fusion:+fusionP.value||0,
    book:g==="armor"?+armorBookP.value:+weaponBookP.value,
    breath:g==="armor"?+iceP.value:+lavaP.value
  };

  const strategies=[
    {k:"normal",n:"① 일반"},
    {k:"bless",n:"② 가호 때만"},
    {k:"always",n:"③ 항상 책+숨결"}
  ];

  let html="";
  strategies.forEach(s=>{
    html+=`<section><h2>${s.n}</h2><table>
    <tr><th>단계</th><th>재련 횟수</th><th>강화 골드</th><th>돌파석</th><th>융화재료</th></tr>`;

    let totalGold=0;

    for(let i=20;i<30;i++){
      const tries = BASE_TRIES_PER_STAGE * STRATEGY[s.k];
      const gold = tries * goldBase;
      const leapUse = tries * leap;
      const fusionUse = tries * fusion;

      totalGold += gold;

      html+=`
      <tr>
        <td>${i} → ${i+1}</td>
        <td>${tries.toFixed(2)}</td>
        <td>${Math.round(gold).toLocaleString()}</td>
        <td>${leapUse.toFixed(1)}</td>
        <td>${fusionUse.toFixed(1)}</td>
      </tr>`;
    }

    html+=`
      <tr>
        <th colspan="2">총합</th>
        <th>${Math.round(totalGold).toLocaleString()}</th>
        <th colspan="2"></th>
      </tr>
    </table></section>`;
  });

  result.innerHTML=html;
}
</script>
</body>
</html>
