<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>상급재련 20~30 전략 비교 계산기</title>
<style>
body { background:#111; color:#eee; font-family:Arial; padding:20px; }
h1,h2 { color:#ffd700; }
section { border:1px solid #333; padding:15px; margin-bottom:20px; }
input, select, button { padding:6px; margin:4px; }
button { background:#ffd700; border:none; cursor:pointer; font-weight:bold; }
.hidden { display:none; }
table { width:100%; border-collapse:collapse; margin-top:10px; }
th, td { border:1px solid #444; padding:6px; text-align:right; }
th { background:#222; }
th:first-child, td:first-child { text-align:left; }
</style>
</head>
<body>

<h1>상급재련 20~30 전략 비교 계산기</h1>

<section>
<h2>장비 선택</h2>
<label><input type="radio" name="gear" value="armor" checked onchange="toggleUI()"> 방어구</label>
<label><input type="radio" name="gear" value="weapon" onchange="toggleUI()"> 무기</label>
</section>

<section>
<h2>재료 가격</h2>

<div id="armorPrice">
  수호석 가격 <input id="guardP" type="number" value="10"><br>
  빙하의 숨결 가격 <input id="iceP" type="number" value="1000"><br>
  방어구용 책 가격 <input id="armorBookP" type="number" value="5000"><br>
</div>

<div id="weaponPrice" class="hidden">
  파괴석 가격 <input id="destroyP" type="number" value="10"><br>
  용암의 숨결 가격 <input id="lavaP" type="number" value="1200"><br>
  무기용 책 가격 <input id="weaponBookP" type="number" value="8000"><br>
</div>

돌파석 가격 <input id="leapP" type="number" value="100"><br>
융화재료 가격 <input id="fusionP" type="number" value="300"><br>
</section>

<section>
<h2>보유 수량</h2>

<div id="armorOwned">
  보유 수호석 <input id="guardO" type="number" value="0"><br>
  보유 빙하 숨결 <input id="iceO" type="number" value="0"><br>
  보유 방어구 책 <input id="armorBookO" type="number" value="0"><br>
</div>

<div id="weaponOwned" class="hidden">
  보유 파괴석 <input id="destroyO" type="number" value="0"><br>
  보유 용암 숨결 <input id="lavaO" type="number" value="0"><br>
  보유 무기 책 <input id="weaponBookO" type="number" value="0"><br>
</div>

보유 돌파석 <input id="leapO" type="number" value="0"><br>
보유 융화재료 <input id="fusionO" type="number" value="0"><br>
</section>

<button onclick="run()">계산</button>

<div id="result"></div>

<script>
function toggleUI(){
  const gear=document.querySelector('input[name=gear]:checked').value;
  document.getElementById("armorPrice").classList.toggle("hidden",gear!=="armor");
  document.getElementById("armorOwned").classList.toggle("hidden",gear!=="armor");
  document.getElementById("weaponPrice").classList.toggle("hidden",gear!=="weapon");
  document.getElementById("weaponOwned").classList.toggle("hidden",gear!=="weapon");
}

function simulate(strategy,cfg){
  let stage=20,exp=0,tries=0,bless=0;
  let use={guard:0,destroy:0,leap:0,fusion:0,book:0,breath:0};
  let enhanced=false,skip=0;

  while(stage<30){
    tries++; bless++;
    let useBook=false,useBreath=false;
    if(strategy==="always") { useBook=true; useBreath=true; }
    if(strategy==="bless" && bless===6) { useBook=true; useBreath=true; }

    let gain=13;
    if(useBook && useBreath){ gain=28; use.book++; use.breath++; }

    if(bless===6){
      bless=0;
      let r=Math.random();
      if(!enhanced){
        if(r<1/6) gain*=5;
        else if(r<2/6) gain*=3;
        else if(r<3/6) gain+=30;
        else if(r<4/6) gain+=10;
        else if(r<5/6) enhanced=true;
        else { stage++; skip++; exp=0; continue; }
      } else {
        if(r<1/5) gain*=7;
        else if(r<2/5) gain*=5;
        else if(r<3/5) gain+=80;
        else if(r<4/5) gain+=30;
        else { stage+=2; skip+=2; exp=0; continue; }
      }
    }

    exp+=gain;
    if(cfg.guard) use.guard+=cfg.guard;
    if(cfg.destroy) use.destroy+=cfg.destroy;
    use.leap+=cfg.leap;
    use.fusion+=cfg.fusion;

    if(exp>=1000){ stage++; exp=0; }
  }
  return {tries,skip,use};
}

function cost(use,price,owned){
  const c=(n,o,p)=>Math.max(0,n-o)*p;
  return {
    guard:c(use.guard,owned.guard,price.guard),
    destroy:c(use.destroy,owned.destroy,price.destroy),
    leap:c(use.leap,owned.leap,price.leap),
    fusion:c(use.fusion,owned.fusion,price.fusion),
    book:c(use.book,owned.book,price.book),
    breath:c(use.breath,owned.breath,price.breath)
  };
}

function run(){
  const gear=document.querySelector('input[name=gear]:checked').value;

  const price={
    guard:gear==="armor"?+guardP.value:0,
    destroy:gear==="weapon"?+destroyP.value:0,
    leap:+leapP.value,
    fusion:+fusionP.value,
    book:gear==="armor"?+armorBookP.value:+weaponBookP.value,
    breath:gear==="armor"?+iceP.value:+lavaP.value
  };

  const owned={
    guard:gear==="armor"?+guardO.value:0,
    destroy:gear==="weapon"?+destroyO.value:0,
    leap:+leapO.value,
    fusion:+fusionO.value,
    book:gear==="armor"?+armorBookO.value:+weaponBookO.value,
    breath:gear==="armor"?+iceO.value:+lavaO.value
  };

  const cfg=gear==="armor"
    ?{gold:2000,guard:1000,destroy:0,leap:18,fusion:17}
    :{gold:3000,guard:0,destroy:1200,leap:25,fusion:28};

  const strategies=[
    {k:"normal",n:"① 일반"},
    {k:"bless",n:"② 가호 때만 책+숨결"},
    {k:"always",n:"③ 항상 책+숨결"}
  ];

  let html="";
  strategies.forEach(s=>{
    const r=simulate(s.k,cfg);
    const c=cost(r.use,price,owned);
    const total=r.tries*cfg.gold+Object.values(c).reduce((a,b)=>a+b,0);

    html+=`
    <section>
    <h2>${s.n}</h2>
    <table>
      <tr><th>항목</th><th>사용 개수</th><th>추가 구매 골드</th></tr>
      ${cfg.guard?`<tr><td>수호석</td><td>${r.use.guard}</td><td>${c.guard.toLocaleString()}</td></tr>`:""}
      ${cfg.destroy?`<tr><td>파괴석</td><td>${r.use.destroy}</td><td>${c.destroy.toLocaleString()}</td></tr>`:""}
      <tr><td>돌파석</td><td>${r.use.leap}</td><td>${c.leap.toLocaleString()}</td></tr>
      <tr><td>융화재료</td><td>${r.use.fusion}</td><td>${c.fusion.toLocaleString()}</td></tr>
      <tr><td>책</td><td>${r.use.book}</td><td>${c.book.toLocaleString()}</td></tr>
      <tr><td>숨결</td><td>${r.use.breath}</td><td>${c.breath.toLocaleString()}</td></tr>
      <tr><th>강화 골드</th><th colspan="2">${(r.tries*cfg.gold).toLocaleString()}</th></tr>
      <tr><th>총합</th><th colspan="2">${total.toLocaleString()}</th></tr>
    </table>
    </section>`;
  });

  result.innerHTML=html;
}
</script>

</body>
</html>
